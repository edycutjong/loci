<!doctype html>
<!-- Loci — 404. Served by Vercel (and by `npm run preview`) for any address that isn't a page. Absolute paths: it can
     be shown at any depth. The room, stops and route are the example palace's (src/examples/). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1534" />
<meta name="robots" content="noindex" />
<title>Not on the route — Loci</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
@font-face { font-family: "Piazzolla Variable"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/piazzolla-latin-opsz-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next Variable"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/atkinson-hyperlegible-mono-latin-700-normal.woff2) format("woff2"); }
/* Loci's tokens: the night, moonlight and state colours of src/styles/tokens.css */
:root {
  --bg:      #0e1534;  /* night-900: a room at night is blue, not black (the Blue Night Rule) */
  --ink:     #eef1fa;  /* moon-100: moonlight type, the current station, primary actions */
  --muted:   #b9c1dd;  /* moon-300: secondary text */
  --before:  #8590b8;  /* state: stop still dark — moon-500, the hollow station rim and the resting dotted route */
  --after:   #46d98a;  /* state: item recalled — the station turns green and its part of the room lights up; fires only on a right answer */
  --rule:    #6e7aa6;  /* line: every control outline, 1.5px */
  --miss:    #ff7f6e;  /* judged wrong: the stop stays dark; never decoration */
  --font-display: "Piazzolla Variable", "Piazzolla", Georgia, serif;
  --font-body:    "Atkinson Hyperlegible Next Variable", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font-data:    "Atkinson Hyperlegible Mono", ui-monospace, monospace;
}
:root { --night-800: #141c40; --night-700: #1d2752; --night-600: #2a3668; --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-lift: 0 2px 4px rgb(4 7 22 / 0.5), 0 10px 28px rgb(4 7 22 / 0.42); --shadow-pin: 0 1px 2px rgb(4 7 22 / 0.7), 0 4px 10px rgb(4 7 22 / 0.5); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); overflow-x: clip; }
body { margin: 0; min-height: 100svh; display: grid; align-items: center; color: var(--ink); font: 400 1.0625rem/1.55 var(--font-body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(60rem 36rem at 80% -10%, #18224f 0%, rgb(24 34 79 / 0) 70%), var(--bg); }
::selection { background: rgb(70 217 138 / 0.32); color: var(--ink); }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); border-radius: 10px; }
img, svg { display: block; max-width: 100%; }
main { width: min(100% - 48px, 1080px); margin: 0 auto; padding: 48px 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(32px, 6vw, 80px); align-items: center; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 650 1.375rem/1 var(--font-display); border-radius: 10px; }
.brand svg { width: 28px; height: 28px; }
.brand { text-decoration: underline 1.5px transparent; text-underline-offset: 0.24em; transition: text-decoration-color 180ms var(--ease-out); }
.brand:hover { text-decoration-color: var(--rule); }
.label { display: flex; align-items: center; gap: 12px; margin: 40px 0 0; color: var(--before); font: 650 0.8125rem/1.2 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; }
.label i { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--miss); }
h1 { margin: 18px 0 16px; font: 650 clamp(2.5rem, 1.6rem + 3.6vw, 4.25rem)/1.02 var(--font-display); letter-spacing: -0.026em; text-wrap: balance; }
p.say { margin: 0; max-width: 42ch; color: var(--muted); font-size: 1.1875rem; }
.go { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 10px; font: 650 1rem/1 var(--font-body); text-decoration: none; border: 1.5px solid var(--rule); background: var(--night-700); color: var(--ink); transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out); }
.btn:hover { background: #253064; border-color: var(--ink); }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-primary:hover { background: #ffffff; border-color: #ffffff; box-shadow: var(--shadow-lift); }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-primary .ic { transition: transform 220ms var(--ease-out); }
.btn-primary:hover .ic { transform: translateX(3px); }
.ver { margin: 36px 0 0; color: var(--before); font-size: 0.875rem; }
.ver code { font: 700 0.8125rem/1 var(--font-data); padding: 4px 7px; border-radius: 6px; border: 1px solid var(--night-600); color: var(--muted); }
figure { margin: 0; justify-self: center; width: min(100%, 400px); }
.stage { position: relative; aspect-ratio: 853 / 1280; border-radius: 16px; overflow: hidden; background: var(--night-800); box-shadow: var(--shadow-lift), 0 40px 80px -30px rgb(4 7 22 / 0.8); }
.room, .room > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.night { fill: var(--bg); opacity: 0.93; }
.pool { opacity: 0; }
.seg path { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.seg .casing { stroke: transparent; }
.seg .track { stroke: var(--before); stroke-width: 2.5px; stroke-dasharray: 0.1px 7px; }
.pins { position: absolute; inset: 0; }
.pin { --size: 30px; position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); width: var(--size); height: var(--size); margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
  display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--before); background: rgb(20 28 64 / 0.92); color: var(--muted); font: 700 12px/1 var(--font-data); box-shadow: var(--shadow-pin); }
.pin svg { display: none; }
.stray { position: absolute; left: 66.6%; top: 21.35%; width: 46px; height: 46px; margin: -23px 0 0 -23px; display: grid; place-items: center; border-radius: 50%; border: 2.5px dashed var(--miss); color: var(--miss); font: 700 20px/1 var(--font-data); background: rgb(14 21 52 / 0.9); box-shadow: var(--shadow-pin); animation: drift 2.8s ease-in-out infinite; }
@keyframes drift { 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .stray { animation: none; } }
figcaption { margin-top: 12px; color: var(--before); font-size: 0.875rem; text-align: center; }
@media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } figure { width: min(100%, 320px); } }
</style>
</head>
