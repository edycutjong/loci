<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Loci — your room as a memory palace. You say the item in the dark; its dim stop turns green and that part of your room lights up.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the Loci mark as shipped (night plate, room, dotted route, two hollow stops, one lit)
  10-24%  trigger:      a listening ring pulses at the first hollow stop                              data-story="beat-2"
  24-55%  mechanism:    You say the item in the dark; its dim stop turns green and that part of your room lights up.   data-story="beat-3"
                        (echo: the second hollow stop lights at 49%)
  55-80%  resolution:   every stop is lit and the whole room comes back (inner light fades in)        data-story="beat-4"
  80-100% breathe + seam: hold, then 88-95% the two stops go dark again; the shipped mark holds 95-100%
-->
<title>Loci — your room as a memory palace. You say the item in the dark; its dim stop turns green and that part of your room lights up.</title>
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <radialGradient id="ia-pool">
    <stop offset="0" stop-color="#eef1fa" stop-opacity="0.2"/>
    <stop offset="0.55" stop-color="#eef1fa" stop-opacity="0.1"/>
    <stop offset="1" stop-color="#eef1fa" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="ia-room"><rect x="56" y="56" width="400" height="400" rx="112"/></clipPath>
</defs>
<!-- brand layer: visible at t=0 (poster rule) -->
<rect width="512" height="512" rx="128" fill="#0e1534"/>
<g clip-path="url(#ia-room)">
  <circle cx="376" cy="312" r="170" fill="url(#ia-pool)"/>
  
    <circle cx="136" cy="344" r="0" fill="url(#ia-pool)" data-story="beat-3">
      <animate attributeName="r" values="0;0;170;170;0;0" keyTimes="0;0.24;0.34;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  
    <circle cx="248" cy="184" r="0" fill="url(#ia-pool)" data-story="beat-3">
      <animate attributeName="r" values="0;0;170;170;0;0" keyTimes="0;0.49;0.59;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  <!-- the whole room comes back once every stop is lit -->
  <rect x="56" y="56" width="400" height="400" fill="#eef1fa" opacity="0" data-story="beat-4">
    <animate attributeName="opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.6;0.68;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="40" y="40" width="432" height="432" rx="128" fill="none" stroke="#eef1fa" stroke-width="32"/>
<path d="M136 344 L248 184 L376 312" fill="none" stroke="#8590b8" stroke-width="28.8" stroke-linecap="round" stroke-dasharray="1.6 54.4"/>

  <circle cx="136" cy="344" r="62" fill="none" stroke="#eef1fa" stroke-width="10" opacity="0" data-story="beat-2">
    <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.1;0.105;0.22;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="62;62;120;120" keyTimes="0;0.1;0.22;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="248" cy="184" r="62" fill="none" stroke="#eef1fa" stroke-width="10" opacity="0" data-story="beat-2">
    <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.36;0.365;0.47;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="62;62;120;120" keyTimes="0;0.36;0.47;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- first stop: hollow → switched on -->
  <circle cx="136" cy="344" r="48" fill="#0e1534" stroke="#eef1fa" stroke-width="28.8">
    <animate attributeName="fill" values="#0e1534;#0e1534;#46d98a;#46d98a;#0e1534;#0e1534" keyTimes="0;0.24;0.26;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#eef1fa;#eef1fa;#46d98a;#46d98a;#eef1fa;#eef1fa" keyTimes="0;0.24;0.26;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="48;48;40;40;48;48" keyTimes="0;0.24;0.26;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- second stop: hollow → switched on -->
  <circle cx="248" cy="184" r="48" fill="#0e1534" stroke="#eef1fa" stroke-width="28.8">
    <animate attributeName="fill" values="#0e1534;#0e1534;#46d98a;#46d98a;#0e1534;#0e1534" keyTimes="0;0.49;0.51;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#eef1fa;#eef1fa;#46d98a;#46d98a;#eef1fa;#eef1fa" keyTimes="0;0.49;0.51;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="48;48;40;40;48;48" keyTimes="0;0.49;0.51;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
  </circle>
<circle cx="376" cy="312" r="54.4" fill="#46d98a"/>
</svg>
